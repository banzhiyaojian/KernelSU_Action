name: Build KernelSU Kernel

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: https://github.com/LineageOS/android_kernel_google_msm
  KERNEL_BRANCH: lineage-22.2
  DEVICE: blueline
  ARCH: arm64
  DEFCONFIG: blueline_defconfig
  KERNELSU_TAG: v0.5.2
  ENABLE_KPM: false
  COMPRESSION: lz4
  CLANG_VERSION: r416183b
  # 给4.9内核开启KSU必需的overlayfs
  ADD_CONFIGS: "CONFIG_OVERLAY_FS=y CONFIG_AUTOFS4_FS=y"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KernelSU_Action
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}-ksu-${{ env.KERNELSU_TAG }}
          path: |
            boot.img
            AnyKernel3/*.zip
